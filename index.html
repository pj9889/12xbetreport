<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12xBET | Admin Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --gold: #fbbf24;
            --green: #22c55e;
            --red: #ef4444;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        .header-title h1 { margin: 0; font-size: 24px; color: var(--gold); }
        .header-title p { margin: 5px 0 0; font-size: 14px; color: #94a3b8; }

        .refresh-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .refresh-btn:hover { opacity: 0.8; }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #334155;
            position: relative;
            overflow: hidden;
        }

        .stat-card i {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 40px;
            opacity: 0.1;
        }

        .stat-card h3 { margin: 0; font-size: 14px; color: #94a3b8; text-transform: uppercase; }
        .stat-card p { margin: 10px 0 0; font-size: 32px; font-weight: bold; }

        /* Charts */
        .charts-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .chart-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #334155;
        }

        .chart-box h2 { font-size: 18px; margin-bottom: 20px; color: var(--accent); }

        @media (max-width: 768px) {
            .charts-container { grid-template-columns: 1fr; }
        }

        #loading-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: var(--bg); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div style="width: 50px; height: 50px; border: 5px solid #334155; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <p style="margin-top: 15px;">Fetching Data from Google Sheet...</p>
    </div>

    <div class="container">
        <header>
            <div class="header-title">
                <h1><i class="fa-solid fa-chart-line"></i> 12xBET Live Analytics</h1>
                <p>Real-time User Activity Tracking</p>
            </div>
            <button class="refresh-btn" onclick="fetchData()"><i class="fa-solid fa-sync"></i> Update Stats</button>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <i class="fa-solid fa-users"></i>
                <h3>Total Visits</h3>
                <p id="visitCount" style="color: var(--accent);">0</p>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-user-plus"></i>
                <h3>Registrations</h3>
                <p id="regCount" style="color: var(--green);">0</p>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-hand-pointer"></i>
                <h3>Deposit Clicks</h3>
                <p id="depCount" style="color: var(--gold);">0</p>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-credit-card"></i>
                <h3>Payment Views</h3>
                <p id="payCount" style="color: var(--red);">0</p>
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-box">
                <h2>Activity Trend (Last Actions)</h2>
                <canvas id="mainChart"></canvas>
            </div>
            <div class="chart-box">
                <h2>Event Ratio</h2>
                <canvas id="pieChart"></canvas>
            </div>
        </div>
    </div>

    <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>

    <script>
        // --- Updated Notun Apps Script URL ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbycpLe5z78uAslyJ7aHLAMzzWyTK2q-sB1t6WQ-0QR5Gkk5_z7SaWVIwQRA_8Yv03xV/exec";

        let mainChart, pieChart;

        async function fetchData() {
            document.getElementById('loading-overlay').style.display = 'flex';
            try {
                // Notun URL theke data fetch kora hochche
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                processData(data);
            } catch (error) {
                console.error("Error:", error);
                alert("Data load hote somoshsha hochche. Link ba Access permission check korun.");
            }
            document.getElementById('loading-overlay').style.display = 'none';
        }

        function processData(data) {
            let counts = {
                "Digital Visit": 0,
                "Registration Complete": 0,
                "Deposit Button Click": 0,
                "Payment Template Viewed": 0
            };

            data.forEach(item => {
                if (counts.hasOwnProperty(item.eventType)) {
                    counts[item.eventType]++;
                }
            });

            document.getElementById('visitCount').innerText = counts["Digital Visit"];
            document.getElementById('regCount').innerText = counts["Registration Complete"];
            document.getElementById('depCount').innerText = counts["Deposit Button Click"];
            document.getElementById('payCount').innerText = counts["Payment Template Viewed"];

            updateCharts(counts);
        }

        function updateCharts(counts) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            const ptx = document.getElementById('pieChart').getContext('2d');

            if (mainChart) mainChart.destroy();
            if (pieChart) pieChart.destroy();

            mainChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Visits', 'Reg', 'Dep Click', 'Pay View'],
                    datasets: [{
                        label: 'Count',
                        data: [counts["Digital Visit"], counts["Registration Complete"], counts["Deposit Button Click"], counts["Payment Template Viewed"]],
                        backgroundColor: ['#38bdf8', '#22c55e', '#fbbf24', '#ef4444'],
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, grid: { color: '#334155' } } }
                }
            });

            pieChart = new Chart(ptx, {
                type: 'doughnut',
                data: {
                    labels: ['Visits', 'Reg', 'Dep', 'Pay'],
                    datasets: [{
                        data: [counts["Digital Visit"], counts["Registration Complete"], counts["Deposit Button Click"], counts["Payment Template Viewed"]],
                        backgroundColor: ['#38bdf8', '#22c55e', '#fbbf24', '#ef4444'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { position: 'bottom', labels: { color: '#f8fafc' } } }
                }
            });
        }

        window.onload = fetchData;
    </script>
</body>
</html>
